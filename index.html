<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lesezeit: Meine Bücher & Statistiken</title>

  <meta name="theme-color" content="#0f1315" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lesezeit" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />
  <link rel="manifest" href="./manifest.json" />

  <style>
    :root {
      --bg-primary: #0f1315;
      --bg-secondary: #171d20;
      --bg-card: #1d2428;
      --bg-elevated: #252e33;
      --text-primary: #f1f5f4;
      --text-secondary: #9aa7a3;
      --text-muted: #6c7975;
      --accent: #2dd4a8;
      --accent-hover: #22b890;
      --accent-soft: rgba(45, 212, 168, 0.14);
      --blue-soft: rgba(56, 189, 248, 0.14);
      --blue: #38bdf8;
      --purple-soft: rgba(192, 132, 252, 0.14);
      --purple: #c084fc;
      --star: #f5b942;
      --danger: #ef5350;
      --border: rgba(255, 255, 255, 0.08);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    [data-theme="light"] {
      --bg-primary: #f4f7f6;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --bg-elevated: #eef3f1;
      --text-primary: #141b19;
      --text-secondary: #4e5d58;
      --text-muted: #7a8984;
      --accent: #139a76;
      --accent-hover: #0e7d60;
      --accent-soft: rgba(19, 154, 118, 0.12);
      --blue-soft: rgba(2, 132, 199, 0.12);
      --blue: #0284c7;
      --purple-soft: rgba(147, 51, 234, 0.12);
      --purple: #9333ea;
      --star: #e59f16;
      --danger: #d9383a;
      --border: rgba(0, 0, 0, 0.09);
      --shadow: 0 8px 24px rgba(15, 23, 20, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      min-height: 100vh;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .app-container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px 18px 64px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo-img {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid var(--border);
      background: #ffffff;
      box-shadow: var(--shadow);
    }

    .brand h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand p {
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #061510;
      font-weight: 650;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-size: 0.92rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .books-subbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .btn-group-toggle {
      background: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border);
      font-weight: 650;
      padding: 8px 13px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-group-toggle.active {
      background: var(--purple-soft);
      color: var(--purple);
      border-color: var(--purple);
    }

    .btn-icon {
      background: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border);
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      display: grid;
      place-items: center;
      font-size: 1.05rem;
    }

    .btn-icon:hover {
      border-color: var(--accent);
    }

    .tabs {
      display: inline-flex;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      padding: 5px;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
      gap: 4px;
    }

    .tab-btn {
      background: transparent;
      color: var(--text-secondary);
      padding: 9px 18px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.92rem;
    }

    .tab-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1.4fr auto auto auto auto;
      gap: 10px;
      margin-bottom: 20px;
    }

    .input, select, textarea {
      width: 100%;
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 13px;
      font-family: inherit;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    .active-series-banner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--purple-soft);
      border: 1px solid var(--purple);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      margin-bottom: 18px;
    }

    .books-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .book-card, .series-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .book-card:hover {
      transform: translateY(-2px);
      border-color: rgba(45, 212, 168, 0.35);
    }

    .series-card {
      cursor: pointer;
      border-color: rgba(192, 132, 252, 0.45);
      background: linear-gradient(160deg, var(--bg-card), rgba(192, 132, 252, 0.08));
    }

    .series-card:hover {
      transform: translateY(-2px);
      border-color: var(--purple);
    }

    .series-stack-badge {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--purple);
      background: var(--purple-soft);
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .series-titles-preview {
      font-size: 0.82rem;
      color: var(--text-secondary);
      background: var(--bg-elevated);
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      border-left: 3px solid var(--purple);
    }

    .book-main {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }

    .book-cover {
      width: 72px;
      height: 104px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
    }

    .book-cover-placeholder {
      width: 72px;
      height: 104px;
      border-radius: 10px;
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: linear-gradient(145deg, var(--bg-elevated), var(--bg-secondary));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6px;
      color: var(--accent);
      font-weight: 800;
      font-size: 1.25rem;
    }

    .book-cover-placeholder span {
      font-size: 0.62rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .book-info {
      flex: 1;
      min-width: 0;
    }

    .badges-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 6px;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 650;
      padding: 3px 9px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .badge-genre {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .badge-status-read {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .badge-status-reading {
      color: var(--blue);
      background: var(--blue-soft);
    }

    .badge-status-wishlist {
      color: var(--purple);
      background: var(--purple-soft);
    }

    .badge-meta {
      color: var(--text-secondary);
      background: var(--bg-elevated);
    }

    .book-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 2px;
      word-wrap: break-word;
    }

    .book-author {
      font-size: 0.86rem;
      color: var(--text-secondary);
    }

    .meta-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .meta-pill {
      background: var(--bg-elevated);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .stars-display {
      color: var(--star);
      font-size: 1rem;
      letter-spacing: 1px;
      margin-top: 8px;
    }

    .reading-progress-box {
      background: var(--bg-elevated);
      border-radius: var(--radius-sm);
      padding: 9px 11px;
    }

    .reading-progress-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      font-weight: 650;
      color: var(--blue);
      margin-bottom: 6px;
    }

    .reading-progress-track {
      width: 100%;
      height: 8px;
      background: var(--bg-secondary);
      border-radius: 999px;
      overflow: hidden;
    }

    .reading-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--blue), var(--accent));
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .book-note {
      font-size: 0.85rem;
      color: var(--text-secondary);
      background: var(--bg-elevated);
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      border-left: 3px solid var(--accent);
    }

    .book-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--text-muted);
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .card-actions {
      display: flex;
      gap: 6px;
    }

    .btn-ghost {
      background: var(--bg-elevated);
      color: var(--text-secondary);
      padding: 5px 9px;
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
      font-weight: 600;
    }

    .btn-ghost:hover {
      color: var(--text-primary);
    }

    .btn-ghost.delete:hover {
      color: var(--danger);
    }

    .stats-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .goal-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .goal-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .goal-title {
      font-size: 1rem;
      font-weight: 700;
    }

    .goal-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .goal-input {
      width: 74px;
      padding: 6px 10px;
      text-align: center;
      font-weight: 700;
    }

    .progress-track {
      width: 100%;
      height: 14px;
      background: var(--bg-elevated);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #159479);
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    .goal-sub {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .kpi-label {
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .kpi-value {
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    .kpi-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .stats-panels {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .favorites-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .fav-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .fav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--bg-elevated);
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
    }

    .fav-rank {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 800;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .fav-name {
      font-weight: 700;
      color: var(--text-primary);
    }

    .fav-meta {
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .fav-score {
      text-align: right;
      font-weight: 700;
      color: var(--star);
      font-size: 0.84rem;
      white-space: nowrap;
    }

    .fav-score small {
      display: block;
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.74rem;
    }

    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .panel h2 {
      font-size: 1.02rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .chart-bars {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      align-items: end;
      gap: 8px;
      height: 220px;
      padding-top: 24px;
    }

    .bar-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
      gap: 5px;
    }

    .bar-count {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-secondary);
      min-height: 16px;
    }

    .bar-track {
      width: 100%;
      max-width: 34px;
      height: 140px;
      background: var(--bg-elevated);
      border-radius: 8px 8px 4px 4px;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
    }

    .bar-fill {
      width: 100%;
      background: linear-gradient(180deg, var(--accent), #159479);
      border-radius: 8px 8px 0 0;
      transition: height 0.35s ease;
    }

    .bar-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .bar-pages {
      font-size: 0.65rem;
      color: var(--text-muted);
      min-height: 14px;
    }

    .year-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .year-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-elevated);
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
    }

    .year-badge {
      font-weight: 700;
      color: var(--accent);
      text-align: right;
    }

    .year-badge small {
      display: block;
      font-weight: 500;
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .empty-state {
      text-align: center;
      padding: 54px 20px;
      background: var(--bg-card);
      border: 1px dashed var(--border);
      border-radius: var(--radius-lg);
      color: var(--text-secondary);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
      overflow-y: auto;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 540px;
      max-height: 92vh;
      overflow-y: auto;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .modal-header h2 {
      font-size: 1.15rem;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .progress-slider-box {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
      margin-bottom: 14px;
    }

    .progress-slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.85rem;
      font-weight: 650;
    }

    .progress-slider-value {
      color: var(--blue);
      font-weight: 800;
      font-size: 0.95rem;
    }

    input[type="range"].range-slider {
      width: 100%;
      accent-color: var(--blue);
      cursor: pointer;
      height: 6px;
    }

    .date-box {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
      margin-bottom: 14px;
    }

    .date-box-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .toggle-switch {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      font-size: 0.88rem;
      font-weight: 650;
      color: var(--text-primary);
    }

    .toggle-switch input {
      display: none;
    }

    .toggle-track {
      width: 44px;
      height: 24px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 999px;
      position: relative;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .toggle-thumb {
      width: 18px;
      height: 18px;
      background: var(--text-muted);
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .toggle-switch input:checked + .toggle-track {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .toggle-switch input:checked + .toggle-track .toggle-thumb {
      transform: translateX(20px);
      background: var(--accent);
    }

    .date-mode-pills {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      margin-bottom: 10px;
    }

    .mode-btn {
      flex: 1;
      background: var(--bg-secondary);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      padding: 7px 10px;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-weight: 600;
    }

    .mode-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
    }

    .cover-upload-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-elevated);
      padding: 10px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }

    .cover-preview-mini {
      width: 44px;
      height: 62px;
      border-radius: 6px;
      object-fit: cover;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .star-picker {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1.55rem;
      flex-wrap: wrap;
    }

    .star-btn {
      background: none;
      color: var(--text-muted);
      padding: 2px;
      line-height: 1;
    }

    .star-btn.active {
      color: var(--star);
      transform: scale(1.08);
    }

    .clear-rating-btn {
      background: var(--bg-elevated);
      color: var(--text-secondary);
      font-size: 0.74rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      margin-left: 4px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-secondary {
      background: var(--bg-elevated);
      color: var(--text-primary);
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.9rem;
    }

    @media (max-width: 900px) {
      .toolbar {
        grid-template-columns: 1fr 1fr;
      }
      .stats-panels, .favorites-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 540px) {
      .toolbar {
        grid-template-columns: 1fr;
      }
      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <div class="brand">
        <img src="./icon-180.png" alt="Lesezeit Logo" class="brand-logo-img" />
        <div>
          <h1>Lesezeit</h1>
          <p>Deine Bücher. Dein Wissen.</p>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" class="btn-icon" id="themeToggle" title="Design wechseln" aria-label="Design wechseln">☀️</button>
        <button type="button" class="btn-primary" id="openAddModal">+ Buch hinzufügen</button>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button type="button" class="tab-btn active" data-tab="books" role="tab">Meine Bücher</button>
      <button type="button" class="tab-btn" data-tab="stats" role="tab">Statistiken</button>
    </nav>

    <section id="tab-books">
      <div class="books-subbar">
        <span id="booksCountHint" style="font-size:0.85rem; color:var(--text-secondary);"></span>
        <button type="button" class="btn-group-toggle" id="toggleSeriesGrouping" title="Bücher derselben Reihe gruppieren">
          <span>📚</span>
          <span id="seriesGroupLabel">Reihen gruppieren</span>
        </button>
      </div>

      <div class="toolbar">
        <input type="text" id="searchInput" class="input" placeholder="Nach Titel, Autor, Reihe, Genre oder Sprache suchen..." />
        <select id="filterStatus">
          <option value="all">Alle Status</option>
          <option value="read">Gelesen</option>
          <option value="reading">Lese ich gerade</option>
          <option value="wishlist">Wunschliste / Noch nicht gelesen</option>
        </select>
        <select id="filterYear">
          <option value="all">Alle Jahre</option>
        </select>
        <select id="filterTop">
          <option value="all">Alle Bücher</option>
          <option value="top5">★ Top-Bücher (5 Sterne)</option>
        </select>
        <select id="filterRating">
          <option value="all">Alle Bewertungen</option>
          <option value="5">5 Sterne</option>
          <option value="4">4+ Sterne</option>
          <option value="3">3+ Sterne</option>
        </select>
      </div>

      <div id="activeSeriesBanner" class="active-series-banner" style="display: none;">
        <div>
          <strong id="activeSeriesTitle" style="color: var(--purple); font-size: 1rem;"></strong>
          <span id="activeSeriesCount" style="color: var(--text-secondary); font-size: 0.85rem; margin-left: 8px;"></span>
        </div>
        <button type="button" class="btn-secondary" id="exitSeriesBtn">← Alle Bücher anzeigen</button>
      </div>

      <div id="booksContainer" class="books-grid"></div>
    </section>

    <section id="tab-stats" style="display: none;">
      <div class="stats-header">
        <div>
          <h2 style="font-size: 1.2rem;">Deine Leseauswertung</h2>
          <p style="font-size: 0.85rem; color: var(--text-secondary);">Monatliche &amp; jährliche Übersicht, Seiten und Favoriten</p>
        </div>
        <select id="statsYearSelect" style="width: auto; min-width: 140px;"></select>
      </div>

      <div class="goal-card">
        <div class="goal-top">
          <div class="goal-title" id="goalHeading">Jahres-Leseziel 2026</div>
          <div class="goal-controls">
            <label for="goalTargetInput">Ziel (Bücher):</label>
            <input type="number" id="goalTargetInput" class="input goal-input" min="1" max="500" value="24" />
          </div>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="goalProgressFill" style="width: 0%;"></div>
        </div>
        <div class="goal-sub">
          <span id="goalProgressText">0 von 24 Büchern gelesen</span>
          <span id="goalPercentText">0 %</span>
        </div>
      </div>

      <div class="kpi-grid" id="kpiGrid"></div>

      <div class="stats-panels">
        <div class="panel">
          <h2 id="monthlyChartTitle">Gelesene Bücher &amp; Seiten pro Monat</h2>
          <div class="chart-bars" id="monthlyChart"></div>
        </div>
        <div class="panel">
          <h2>Bücher &amp; Seiten pro Jahr</h2>
          <div class="year-list" id="yearlyList"></div>
        </div>
      </div>

      <div class="favorites-grid">
        <div class="panel">
          <h2>Lieblingsgenres</h2>
          <div class="fav-list" id="topGenresList"></div>
        </div>
        <div class="panel">
          <h2>Lieblingsautoren</h2>
          <div class="fav-list" id="topAuthorsList"></div>
        </div>
      </div>
    </section>
  </div>

  <div class="modal-backdrop" id="bookModal" aria-hidden="true">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Buch speichern</h2>
        <button type="button" class="btn-icon" id="closeModal" style="width:34px;height:34px;" aria-label="Schließen">✕</button>
      </div>
      <form id="bookForm">
        <input type="hidden" id="editBookId" />
        <input type="hidden" id="bookCoverData" />

        <div class="form-row">
          <div class="form-group">
            <label for="bookTitle">Buchtitel (optional)</label>
            <input type="text" id="bookTitle" class="input" placeholder="z. B. Dune, Band 1" />
          </div>
          <div class="form-group">
            <label for="bookStatus">Lese-Status (optional)</label>
            <select id="bookStatus">
              <option value="read">Gelesen</option>
              <option value="reading">Lese ich gerade</option>
              <option value="wishlist">Wunschliste (Noch nicht gelesen)</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="bookSeries">Reihe / Serie (optional)</label>
            <input type="text" id="bookSeries" class="input" list="seriesSuggestions" placeholder="z. B. Dune" />
            <datalist id="seriesSuggestions"></datalist>
          </div>
          <div class="form-group">
            <label for="bookVolume">Band / Nr. (optional)</label>
            <input type="text" id="bookVolume" class="input" placeholder="z. B. 1 oder Band 1" />
          </div>
        </div>

        <div class="progress-slider-box" id="readingProgressBox" style="display: none;">
          <div class="progress-slider-header">
            <label for="bookProgressSlider" style="margin:0; color:var(--text-primary);">Fortschritt (wie viel gelesen?)</label>
            <span class="progress-slider-value" id="bookProgressValue">0 %</span>
          </div>
          <input type="range" id="bookProgressSlider" class="range-slider" min="0" max="100" step="1" value="0" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="bookAuthor">Autor/in (optional)</label>
            <input type="text" id="bookAuthor" class="input" placeholder="z. B. Frank Herbert" />
          </div>
          <div class="form-group">
            <label for="bookPages">Seitenzahl (optional)</label>
            <input type="number" id="bookPages" class="input" min="1" max="10000" placeholder="z. B. 496" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="bookFormat">Format (optional)</label>
            <select id="bookFormat">
              <option value="">Kein Format</option>
              <option value="E-Book">E-Book</option>
              <option value="Taschenbuch">Taschenbuch</option>
              <option value="Hardcover">Hardcover</option>
              <option value="Hörbuch">Hörbuch</option>
            </select>
          </div>
          <div class="form-group">
            <label for="bookLanguage">Sprache (optional)</label>
            <input type="text" id="bookLanguage" class="input" list="languageSuggestions" placeholder="z. B. Deutsch, Englisch, FR" />
            <datalist id="languageSuggestions">
              <option value="Deutsch"></option>
              <option value="Englisch"></option>
              <option value="Französisch"></option>
              <option value="Niederländisch"></option>
              <option value="Italienisch"></option>
              <option value="Luxemburgisch"></option>
              <option value="Spanisch"></option>
            </datalist>
          </div>
        </div>

        <div class="date-box" id="dateBox">
          <div class="date-box-header">
            <label class="toggle-switch" for="useDatesToggle">
              <input type="checkbox" id="useDatesToggle" checked />
              <span class="toggle-track"><span class="toggle-thumb"></span></span>
              <span>Start- &amp; Enddatum nutzen</span>
            </label>
            <span id="dateToggleStatus" style="font-size:0.78rem; color:var(--accent); font-weight:600;">An</span>
          </div>

          <div id="dateOptionsBody">
            <div class="date-mode-pills" role="group" aria-label="Datumsauswahl">
              <button type="button" class="mode-btn active" id="modeStartAndEnd" data-mode="both">Start- &amp; Enddatum</button>
              <button type="button" class="mode-btn" id="modeStartOnly" data-mode="start_only">Nur Startdatum</button>
            </div>

            <div class="form-row" id="dateInputsRow" style="margin-bottom:0;">
              <div class="form-group" id="startDateGroup" style="margin-bottom:0;">
                <label for="bookStartDate">Startdatum (optional)</label>
                <input type="date" id="bookStartDate" class="input" />
              </div>
              <div class="form-group" id="endDateGroup" style="margin-bottom:0;">
                <label for="bookDate">Enddatum (optional)</label>
                <input type="date" id="bookDate" class="input" />
              </div>
            </div>
          </div>
        </div>

        <div class="form-row" id="genreRatingRow">
          <div class="form-group">
            <label for="bookGenre">Genre (optional)</label>
            <input type="text" id="bookGenre" class="input" placeholder="z. B. Sci-Fi, Sachbuch" />
          </div>
          <div class="form-group" id="ratingGroup">
            <label>Sterne-Bewertung (optional)</label>
            <div class="star-picker" id="starPicker">
              <button type="button" class="star-btn" data-value="1" aria-label="1 Stern">★</button>
              <button type="button" class="star-btn" data-value="2" aria-label="2 Sterne">★</button>
              <button type="button" class="star-btn" data-value="3" aria-label="3 Sterne">★</button>
              <button type="button" class="star-btn" data-value="4" aria-label="4 Sterne">★</button>
              <button type="button" class="star-btn" data-value="5" aria-label="5 Sterne">★</button>
              <button type="button" class="clear-rating-btn" id="clearRatingBtn" title="Bewertung entfernen">Keine</button>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>Buchcover (optional)</label>
          <div class="cover-upload-box">
            <img id="coverPreviewMini" class="cover-preview-mini" alt="Cover Vorschau" style="display:none;" />
            <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
              <input type="file" id="bookCoverFile" accept="image/*" style="font-size:0.8rem; color:var(--text-secondary);" />
              <input type="url" id="bookCoverUrl" class="input" placeholder="Oder Cover-Bild-URL (https://...)" style="padding:7px 10px; font-size:0.82rem;" />
            </div>
            <button type="button" class="btn-ghost" id="clearCoverBtn" title="Cover entfernen">Entfernen</button>
          </div>
        </div>

        <div class="form-group">
          <label for="bookNote">Kurze Notiz (optional)</label>
          <textarea id="bookNote" rows="2" placeholder="Was hat dir besonders gefallen?"></textarea>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-secondary" id="cancelModal">Abbrechen</button>
          <button type="submit" class="btn-primary">Speichern</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => {
        regs.forEach((r) => r.update());
      }).catch(() => {});
    }

    const STORAGE_KEY = "lesezeit_books_v9";
    const THEME_KEY = "lesezeit_theme_v1";
    const GOALS_KEY = "lesezeit_goals_v1";
    const GROUP_KEY = "lesezeit_group_series_v1";
    const MONTHS = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];

    const STATUS_LABELS = {
      read: { text: "Gelesen", cls: "badge-status-read" },
      reading: { text: "Lese ich gerade", cls: "badge-status-reading" },
      wishlist: { text: "Wunschliste", cls: "badge-status-wishlist" }
    };

    const sampleBooks = [
      {
        id: "1",
        title: "Die Tribute von Panem, Band 1",
        author: "Suzanne Collins",
        series: "Die Tribute von Panem",
        volume: "1",
        status: "read",
        progress: 100,
        useDates: true,
        dateMode: "both",
        startDate: "2026-01-04",
        dateRead: "2026-01-12",
        pages: 416,
        genre: "Dystopie",
        format: "Taschenbuch",
        language: "Deutsch",
        rating: 5,
        cover: "",
        note: "Band 1 der Reihe."
      },
      {
        id: "2",
        title: "Die Tribute von Panem, Band 2",
        author: "Suzanne Collins",
        series: "Die Tribute von Panem",
        volume: "2",
        status: "read",
        progress: 100,
        useDates: true,
        dateMode: "both",
        startDate: "2026-01-15",
        dateRead: "2026-01-25",
        pages: 448,
        genre: "Dystopie",
        format: "Taschenbuch",
        language: "Deutsch",
        rating: 5,
        cover: "",
        note: "Band 2 der Reihe."
      },
      {
        id: "3",
        title: "Die Tribute von Panem, Band 3",
        author: "Suzanne Collins",
        series: "Die Tribute von Panem",
        volume: "3",
        status: "read",
        progress: 100,
        useDates: true,
        dateMode: "both",
        startDate: "2026-02-01",
        dateRead: "2026-02-14",
        pages: 464,
        genre: "Dystopie",
        format: "Taschenbuch",
        language: "Deutsch",
        rating: 4,
        cover: "",
        note: "Band 3 der Reihe."
      },
      {
        id: "4",
        title: "Projekt Hail Mary",
        author: "Andy Weir",
        series: "",
        volume: "",
        status: "read",
        progress: 100,
        useDates: true,
        dateMode: "both",
        startDate: "2026-03-02",
        dateRead: "2026-03-16",
        pages: 496,
        genre: "Sci-Fi",
        format: "E-Book",
        language: "Deutsch",
        rating: 5,
        cover: "",
        note: "Sehr starkes Sci-Fi-Buch."
      }
    ];

    function todayISO() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    let books = loadBooks();
    let goals = loadGoals();
    let groupSeriesEnabled = localStorage.getItem(GROUP_KEY) === "true";
    let openedSeriesKey = null;
    let currentRating = 0;
    let currentDateMode = "both";

    function loadBooks() {
      try {
        const keys = [
          STORAGE_KEY,
          "lesezeit_books_v8",
          "lesezeit_books_v7",
          "lesezeit_books_v6",
          "lesezeit_books_v5",
          "lesezeit_books_v4",
          "lesezeit_books_v3",
          "lesezeit_books_v2",
          "lesezeit_books_v1"
        ];
        let parsed = null;
        for (const k of keys) {
          const raw = localStorage.getItem(k);
          if (raw) {
            parsed = JSON.parse(raw);
            break;
          }
        }
        if (!Array.isArray(parsed) || parsed.length === 0) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(sampleBooks));
          return [...sampleBooks];
        }
        return parsed.map((b) => ({
          status: "read",
          series: "",
          volume: "",
          progress: b.status === "read" ? 100 : 0,
          useDates: Boolean(b.startDate || b.dateRead),
          dateMode: b.dateRead ? "both" : "start_only",
          startDate: "",
          dateRead: "",
          pages: 0,
          format: "",
          language: "",
          rating: 0,
          cover: "",
          ...b
        }));
      } catch {
        return [...sampleBooks];
      }
    }

    function saveBooks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(books));
      refreshSeriesDatalist();
    }

    function refreshSeriesDatalist() {
      const dl = document.getElementById("seriesSuggestions");
      const names = Array.from(
        new Set(books.map((b) => (b.series || "").trim()).filter(Boolean))
      ).sort((a, b) => a.localeCompare(b, "de"));
      dl.innerHTML = names.map((n) => `<option value="${escapeHTML(n)}"></option>`).join("");
    }

    function loadGoals() {
      try {
        return JSON.parse(localStorage.getItem(GOALS_KEY)) || {};
      } catch {
        return {};
      }
    }

    function saveGoals() {
      localStorage.setItem(GOALS_KEY, JSON.stringify(goals));
    }

    function initTheme() {
      const savedTheme = localStorage.getItem(THEME_KEY) || "dark";
      applyTheme(savedTheme);
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem(THEME_KEY, theme);
      document.getElementById("themeToggle").textContent = theme === "dark" ? "☀️" : "🌙";
    }

    document.getElementById("themeToggle").addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme");
      applyTheme(current === "dark" ? "light" : "dark");
    });

    function syncSeriesToggleUI() {
      const btn = document.getElementById("toggleSeriesGrouping");
      const lbl = document.getElementById("seriesGroupLabel");
      btn.classList.toggle("active", groupSeriesEnabled);
      lbl.textContent = groupSeriesEnabled ? "Reihen gruppiert" : "Reihen gruppieren";
    }

    document.getElementById("toggleSeriesGrouping").addEventListener("click", () => {
      groupSeriesEnabled = !groupSeriesEnabled;
      localStorage.setItem(GROUP_KEY, String(groupSeriesEnabled));
      if (!groupSeriesEnabled) {
        openedSeriesKey = null;
      }
      syncSeriesToggleUI();
      renderBooks();
    });

    document.getElementById("exitSeriesBtn").addEventListener("click", () => {
      openedSeriesKey = null;
      renderBooks();
    });

    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const tab = btn.dataset.tab;
        document.getElementById("tab-books").style.display = tab === "books" ? "block" : "none";
        document.getElementById("tab-stats").style.display = tab === "stats" ? "block" : "none";
        if (tab === "stats") {
          refreshYearSelectors();
          renderStats();
        }
      });
    });

    const modal = document.getElementById("bookModal");
    const bookForm = document.getElementById("bookForm");
    const statusSelect = document.getElementById("bookStatus");
    const useDatesToggle = document.getElementById("useDatesToggle");
    const progressSlider = document.getElementById("bookProgressSlider");
    const progressValueLabel = document.getElementById("bookProgressValue");

    progressSlider.addEventListener("input", () => {
      progressValueLabel.textContent = `${progressSlider.value} %`;
    });

    function setDateMode(mode) {
      currentDateMode = mode;
      document.getElementById("modeStartAndEnd").classList.toggle("active", mode === "both");
      document.getElementById("modeStartOnly").classList.toggle("active", mode === "start_only");

      const endDateGroup = document.getElementById("endDateGroup");
      const dateInputsRow = document.getElementById("dateInputsRow");

      if (mode === "start_only") {
        endDateGroup.style.display = "none";
        dateInputsRow.style.gridTemplateColumns = "1fr";
      } else {
        endDateGroup.style.display = "block";
        dateInputsRow.style.gridTemplateColumns = "1fr 1fr";
      }
    }

    function syncDateAndRatingVisibility() {
      const status = statusSelect.value;
      const readingProgressBox = document.getElementById("readingProgressBox");
      const dateBox = document.getElementById("dateBox");
      const dateOptionsBody = document.getElementById("dateOptionsBody");
      const toggleStatus = document.getElementById("dateToggleStatus");
      const ratingGroup = document.getElementById("ratingGroup");
      const genreRatingRow = document.getElementById("genreRatingRow");

      readingProgressBox.style.display = status === "reading" ? "block" : "none";

      if (status === "wishlist") {
        dateBox.style.display = "none";
        useDatesToggle.checked = false;
        ratingGroup.style.display = "none";
        genreRatingRow.style.gridTemplateColumns = "1fr";
        return;
      }

      dateBox.style.display = "block";
      const datesEnabled = useDatesToggle.checked;
      dateOptionsBody.style.display = datesEnabled ? "block" : "none";
      toggleStatus.textContent = datesEnabled ? "An" : "Aus";
      toggleStatus.style.color = datesEnabled ? "var(--accent)" : "var(--text-muted)";
      setDateMode(currentDateMode);

      if (status === "reading") {
        ratingGroup.style.display = "none";
        genreRatingRow.style.gridTemplateColumns = "1fr";
      } else {
        ratingGroup.style.display = "block";
        genreRatingRow.style.gridTemplateColumns = "1fr 1fr";
      }
    }

    useDatesToggle.addEventListener("change", syncDateAndRatingVisibility);
    document.getElementById("modeStartAndEnd").addEventListener("click", () => setDateMode("both"));
    document.getElementById("modeStartOnly").addEventListener("click", () => setDateMode("start_only"));

    statusSelect.addEventListener("change", () => {
      if (statusSelect.value === "wishlist") {
        useDatesToggle.checked = false;
        currentRating = 0;
        updateStarPicker(0);
      } else if (statusSelect.value === "reading") {
        useDatesToggle.checked = true;
        setDateMode("start_only");
        if (!document.getElementById("bookStartDate").value) {
          document.getElementById("bookStartDate").value = todayISO();
        }
        currentRating = 0;
        updateStarPicker(0);
      } else {
        useDatesToggle.checked = true;
        setDateMode("both");
        if (!document.getElementById("bookDate").value) {
          document.getElementById("bookDate").value = todayISO();
        }
      }
      syncDateAndRatingVisibility();
    });

    function setCoverPreview(src) {
      const img = document.getElementById("coverPreviewMini");
      document.getElementById("bookCoverData").value = src || "";
      if (src) {
        img.src = src;
        img.style.display = "block";
      } else {
        img.removeAttribute("src");
        img.style.display = "none";
      }
    }

    document.getElementById("bookCoverFile").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const maxW = 240;
          const scale = Math.min(1, maxW / img.width);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const compressed = canvas.toDataURL("image/jpeg", 0.8);
          document.getElementById("bookCoverUrl").value = "";
          setCoverPreview(compressed);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById("bookCoverUrl").addEventListener("input", (e) => {
      setCoverPreview(e.target.value.trim());
    });

    document.getElementById("clearCoverBtn").addEventListener("click", () => {
      document.getElementById("bookCoverFile").value = "";
      document.getElementById("bookCoverUrl").value = "";
      setCoverPreview("");
    });

    function updateStarPicker(val) {
      document.querySelectorAll(".star-btn").forEach((btn) => {
        const v = Number(btn.dataset.value);
        btn.classList.toggle("active", val > 0 && v <= val);
      });
    }

    document.querySelectorAll(".star-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const clicked = Number(btn.dataset.value);
        currentRating = currentRating === clicked ? 0 : clicked;
        updateStarPicker(currentRating);
      });
    });

    document.getElementById("clearRatingBtn").addEventListener("click", () => {
      currentRating = 0;
      updateStarPicker(0);
    });

    function openModal(book = null) {
      bookForm.reset();
      setCoverPreview("");

      if (book) {
        document.getElementById("modalTitle").textContent = "Buch bearbeiten";
        document.getElementById("editBookId").value = book.id;
        document.getElementById("bookTitle").value = book.title || "";
        document.getElementById("bookAuthor").value = book.author || "";
        document.getElementById("bookSeries").value = book.series || "";
        document.getElementById("bookVolume").value = book.volume || "";
        document.getElementById("bookStatus").value = book.status || "read";
        const prog = Number(book.progress) || 0;
        progressSlider.value = prog;
        progressValueLabel.textContent = `${prog} %`;
        document.getElementById("bookStartDate").value = book.startDate || "";
        document.getElementById("bookDate").value = book.dateRead || "";
        document.getElementById("bookPages").value = book.pages || "";
        document.getElementById("bookFormat").value = book.format || "";
        document.getElementById("bookLanguage").value = book.language || "";
        document.getElementById("bookGenre").value = book.genre || "";
        document.getElementById("bookNote").value = book.note || "";

        if (book.cover) {
          if (book.cover.startsWith("http")) {
            document.getElementById("bookCoverUrl").value = book.cover;
          }
          setCoverPreview(book.cover);
        }

        currentRating = Number(book.rating) || 0;
        useDatesToggle.checked = book.status !== "wishlist" && (book.useDates !== undefined ? Boolean(book.useDates) : Boolean(book.startDate || book.dateRead));
        currentDateMode = book.dateMode || (book.dateRead ? "both" : "start_only");
      } else {
        document.getElementById("modalTitle").textContent = "Buch speichern";
        document.getElementById("editBookId").value = "";
        document.getElementById("bookStatus").value = "read";
        document.getElementById("bookSeries").value = openedSeriesKey || "";
        document.getElementById("bookVolume").value = "";
        progressSlider.value = 0;
        progressValueLabel.textContent = "0 %";
        document.getElementById("bookDate").value = todayISO();
        document.getElementById("bookFormat").value = "";
        document.getElementById("bookLanguage").value = "";
        currentRating = 0;
        useDatesToggle.checked = true;
        currentDateMode = "both";
      }

      updateStarPicker(currentRating);
      setDateMode(currentDateMode);
      syncDateAndRatingVisibility();
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
    }

    function closeModal() {
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
    }

    document.getElementById("openAddModal").addEventListener("click", () => openModal());
    document.getElementById("closeModal").addEventListener("click", closeModal);
    document.getElementById("cancelModal").addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });

    bookForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const id = document.getElementById("editBookId").value || String(Date.now());
      const existing = books.find((b) => b.id === id) || null;
      const status = document.getElementById("bookStatus").value;
      const datesActive = status !== "wishlist" && useDatesToggle.checked;

      let rawStart = datesActive ? document.getElementById("bookStartDate").value : "";
      let rawEnd = datesActive ? document.getElementById("bookDate").value : "";

      if (status === "read" && !rawEnd) {
        rawEnd = (existing && existing.dateRead) || todayISO();
      }

      const finalDateMode = status === "read" && rawEnd ? "both" : currentDateMode;

      const entry = {
        id,
        title: document.getElementById("bookTitle").value.trim() || "Unbenanntes Buch",
        author: document.getElementById("bookAuthor").value.trim(),
        series: document.getElementById("bookSeries").value.trim(),
        volume: document.getElementById("bookVolume").value.trim(),
        status,
        progress: status === "reading" ? Number(progressSlider.value) || 0 : status === "read" ? 100 : 0,
        useDates: status === "read" ? true : datesActive,
        dateMode: finalDateMode,
        startDate: rawStart,
        dateRead: status === "read" ? rawEnd : (currentDateMode === "both" ? rawEnd : ""),
        pages: Number(document.getElementById("bookPages").value) || 0,
        format: document.getElementById("bookFormat").value,
        language: document.getElementById("bookLanguage").value.trim(),
        genre: document.getElementById("bookGenre").value.trim(),
        rating: status === "read" ? currentRating : 0,
        cover: document.getElementById("bookCoverData").value || "",
        note: document.getElementById("bookNote").value.trim()
      };

      const existingIndex = books.findIndex((b) => b.id === id);
      if (existingIndex > -1) {
        books[existingIndex] = entry;
      } else {
        books.unshift(entry);
      }

      saveBooks();
      closeModal();
      refreshYearSelectors();
      renderBooks();
      renderStats();
    });

    function deleteBook(id) {
      books = books.filter((b) => b.id !== id);
      saveBooks();
      refreshYearSelectors();
      renderBooks();
      renderStats();
    }

    function getEffectiveReadDate(b) {
      return b.dateRead || b.startDate || todayISO();
    }

    function getYears() {
      const currentYear = String(new Date().getFullYear());
      const set = new Set([currentYear]);
      books.forEach((b) => {
        if ((b.status || "read") === "read") {
          const eff = b.dateRead || b.startDate;
          const y = eff && eff.length >= 4 ? eff.slice(0, 4) : currentYear;
          if (/^\d{4}$/.test(y)) set.add(y);
        }
      });
      return Array.from(set).sort((a, b) => b.localeCompare(a));
    }

    function refreshYearSelectors() {
      const years = getYears();
      const filterYear = document.getElementById("filterYear");
      const statsYear = document.getElementById("statsYearSelect");

      const prevFilter = filterYear.value;
      filterYear.innerHTML = `<option value="all">Alle Jahre</option>` +
        years.map((y) => `<option value="${y}">${y}</option>`).join("");
      if ([...filterYear.options].some((o) => o.value === prevFilter)) {
        filterYear.value = prevFilter;
      }

      const prevStats = statsYear.value;
      statsYear.innerHTML = years.map((y) => `<option value="${y}">${y}</option>`).join("");
      if (prevStats && years.includes(prevStats)) {
        statsYear.value = prevStats;
      } else {
        statsYear.value = String(new Date().getFullYear());
      }
    }

    function formatStars(rating) {
      return "★".repeat(rating) + "☆".repeat(5 - rating);
    }

    function formatDateDE(dateStr) {
      if (!dateStr) return "";
      const [y, m, d] = dateStr.split("-");
      return `${d}.${m}.${y}`;
    }

    function calcDurationDays(startStr, endStr) {
      if (!startStr || !endStr) return null;
      const start = new Date(startStr);
      const end = new Date(endStr);
      const diff = Math.round((end - start) / (1000 * 60 * 60 * 24));
      if (isNaN(diff) || diff < 0) return null;
      return diff + 1;
    }

    function escapeHTML(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function extractVolumeNumber(volStr) {
      const m = String(volStr || "").match(/\d+/);
      return m ? Number(m[0]) : null;
    }

    function formatVolumeRange(seriesBooks) {
      const nums = seriesBooks
        .map((b) => extractVolumeNumber(b.volume))
        .filter((n) => n !== null)
        .sort((a, b) => a - b);

      if (nums.length >= 2) {
        return `Band ${nums[0]}-${nums[nums.length - 1]}`;
      }
      if (nums.length === 1) {
        return `Band ${nums[0]}`;
      }
      return `${seriesBooks.length} ${seriesBooks.length === 1 ? "Buch" : "Bücher"}`;
    }

    function renderSingleBookCard(b) {
      const bStatus = b.status || "read";
      const st = STATUS_LABELS[bStatus] || STATUS_LABELS.read;
      const duration = bStatus === "read" && b.useDates !== false ? calcDurationDays(b.startDate, b.dateRead) : null;
      const displayTitle = b.title || "Unbenanntes Buch";
      const initials = escapeHTML(displayTitle.slice(0, 2).toUpperCase());
      const prog = Math.max(0, Math.min(100, Number(b.progress) || 0));
      const currentPage = b.pages > 0 ? Math.round((prog / 100) * b.pages) : 0;

      let dateFooter = "Kein Datum";
      if (bStatus !== "wishlist" && b.useDates !== false) {
        if (b.startDate && b.dateRead && b.dateMode !== "start_only") {
          dateFooter = `${formatDateDE(b.startDate)} bis ${formatDateDE(b.dateRead)}`;
        } else if (b.dateRead && b.dateMode !== "start_only") {
          dateFooter = `Gelesen: ${formatDateDE(b.dateRead)}`;
        } else if (b.startDate) {
          dateFooter = `Start: ${formatDateDE(b.startDate)}`;
        }
      }

      const seriesBadgeText = b.series
        ? `${b.series}${b.volume ? ` · ${/^band/i.test(b.volume) ? b.volume : `Band ${b.volume}`}` : ""}`
        : "";

      return `
        <article class="book-card" data-book-id="${escapeHTML(b.id)}">
          <div class="book-main">
            ${
              b.cover
                ? `<img src="${escapeHTML(b.cover)}" alt="Cover ${escapeHTML(displayTitle)}" class="book-cover" />`
                : `<div class="book-cover-placeholder">${initials}<span>Buch</span></div>`
            }
            <div class="book-info">
              <div class="badges-row">
                <span class="badge ${st.cls}">${st.text}</span>
                ${seriesBadgeText ? `<span class="badge badge-status-wishlist">${escapeHTML(seriesBadgeText)}</span>` : ""}
                ${b.genre ? `<span class="badge badge-genre">${escapeHTML(b.genre)}</span>` : ""}
                ${b.format ? `<span class="badge badge-meta">${escapeHTML(b.format)}</span>` : ""}
                ${b.language ? `<span class="badge badge-meta">${escapeHTML(b.language)}</span>` : ""}
              </div>
              <div class="book-title">${escapeHTML(displayTitle)}</div>
              ${b.author ? `<div class="book-author">${escapeHTML(b.author)}</div>` : ""}
              ${
                bStatus === "read" && Number(b.rating) > 0
                  ? `<div class="stars-display" title="${b.rating} von 5 Sternen">${formatStars(Number(b.rating))}</div>`
                  : ""
              }
              ${
                b.pages || duration
                  ? `<div class="meta-pills">
                      ${b.pages ? `<span class="meta-pill">📄 ${b.pages} Seiten</span>` : ""}
                      ${duration ? `<span class="meta-pill">⏱️ ${duration} ${duration === 1 ? "Tag" : "Tage"}</span>` : ""}
                    </div>`
                  : ""
              }
            </div>
          </div>
          ${
            bStatus === "reading"
              ? `<div class="reading-progress-box">
                  <div class="reading-progress-top">
                    <span>Fortschritt: ${prog} %</span>
                    <span>${b.pages > 0 ? `ca. Seite ${currentPage} / ${b.pages}` : "Lese ich gerade"}</span>
                  </div>
                  <div class="reading-progress-track">
                    <div class="reading-progress-fill" style="width: ${prog}%;"></div>
                  </div>
                </div>`
              : ""
          }
          ${b.note ? `<p class="book-note">${escapeHTML(b.note)}</p>` : ""}
          <div class="book-footer">
            <span>${dateFooter}</span>
            <div class="card-actions">
              <button type="button" class="btn-ghost js-edit-book" data-id="${escapeHTML(b.id)}">Bearbeiten</button>
              <button type="button" class="btn-ghost delete js-delete-book" data-id="${escapeHTML(b.id)}">Löschen</button>
            </div>
          </div>
        </article>
      `;
    }

    function renderSeriesCard(seriesName, items) {
      const volRange = formatVolumeRange(items);
      const authors = Array.from(new Set(items.map((b) => (b.author || "").trim()).filter(Boolean))).join(", ");
      const totalPages = items.reduce((sum, b) => sum + (Number(b.pages) || 0), 0);
      const rated = items.filter((b) => Number(b.rating) > 0);
      const avg = rated.length
        ? (rated.reduce((sum, b) => sum + Number(b.rating), 0) / rated.length).toFixed(1)
        : null;
      const previewTitles = items
        .map((b) => b.title || "Unbenanntes Buch")
        .slice(0, 3)
        .join(" · ");

      return `
        <article class="series-card js-open-series" data-series="${escapeHTML(seriesName)}" title="Klicken, um die Bücher dieser Reihe anzuzeigen">
          <div>
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
              <div>
                <div class="book-title">${escapeHTML(seriesName)}</div>
                ${authors ? `<div class="book-author">${escapeHTML(authors)}</div>` : ""}
              </div>
              <span class="series-stack-badge">${escapeHTML(volRange)}</span>
            </div>
            <div class="meta-pills">
              <span class="meta-pill">📚 ${items.length} ${items.length === 1 ? "Buch" : "Bücher"}</span>
              ${totalPages ? `<span class="meta-pill">📄 ${totalPages} Seiten</span>` : ""}
              ${avg ? `<span class="meta-pill" style="color:var(--star);">★ ${avg}</span>` : ""}
            </div>
            <p class="series-titles-preview" style="margin-top:10px;">${escapeHTML(previewTitles)}</p>
          </div>
          <div class="book-footer">
            <span style="color:var(--purple); font-weight:600;">Tippen zum Öffnen →</span>
            <span>${escapeHTML(volRange)}</span>
          </div>
        </article>
      `;
    }

    function renderBooks() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      const statusFilter = document.getElementById("filterStatus").value;
      const year = document.getElementById("filterYear").value;
      const topFilter = document.getElementById("filterTop").value;
      const minRating = document.getElementById("filterRating").value;

      let filtered = books
        .filter((b) => {
          const bStatus = b.status || "read";
          const effDate = b.dateRead || b.startDate || "";
          const matchesQuery =
            !q ||
            (b.title && b.title.toLowerCase().includes(q)) ||
            (b.author && b.author.toLowerCase().includes(q)) ||
            (b.series && b.series.toLowerCase().includes(q)) ||
            (b.genre && b.genre.toLowerCase().includes(q)) ||
            (b.language && b.language.toLowerCase().includes(q)) ||
            (b.format && b.format.toLowerCase().includes(q));
          const matchesStatus = statusFilter === "all" || bStatus === statusFilter;
          const matchesYear = year === "all" || (effDate && effDate.startsWith(year));
          const matchesTop = topFilter !== "top5" || (bStatus === "read" && Number(b.rating) === 5);
          const matchesRating = minRating === "all" || (bStatus === "read" && Number(b.rating) >= Number(minRating));
          return matchesQuery && matchesStatus && matchesYear && matchesTop && matchesRating;
        })
        .sort((a, b) => {
          const volA = extractVolumeNumber(a.volume);
          const volB = extractVolumeNumber(b.volume);
          if (openedSeriesKey && volA !== null && volB !== null && volA !== volB) {
            return volA - volB;
          }
          return (b.dateRead || b.startDate || "").localeCompare(a.dateRead || a.startDate || "");
        });

      const banner = document.getElementById("activeSeriesBanner");
      if (openedSeriesKey) {
        filtered = filtered.filter((b) => (b.series || "").trim().toLowerCase() === openedSeriesKey.toLowerCase());
        banner.style.display = "flex";
        document.getElementById("activeSeriesTitle").textContent = `Reihe: ${openedSeriesKey}`;
        document.getElementById("activeSeriesCount").textContent = `(${filtered.length} ${filtered.length === 1 ? "Buch" : "Bücher"})`;
      } else {
        banner.style.display = "none";
      }

      document.getElementById("booksCountHint").textContent =
        `${filtered.length} ${filtered.length === 1 ? "Eintrag" : "Einträge"}`;

      const container = document.getElementById("booksContainer");
      if (!filtered.length) {
        container.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <h3>Keine passenden Bücher gefunden</h3>
            <p style="margin-top:6px;">Lege über „+ Buch hinzufügen“ dein erstes Buch an oder passe die Filter an.</p>
          </div>
        `;
        return;
      }

      if (groupSeriesEnabled && !openedSeriesKey) {
        const seriesMap = new Map();
        const standaloneBooks = [];

        filtered.forEach((b) => {
          const sName = (b.series || "").trim();
          if (sName) {
            const normKey = sName.toLowerCase();
            if (!seriesMap.has(normKey)) {
              seriesMap.set(normKey, { displayName: sName, items: [] });
            }
            seriesMap.get(normKey).items.push(b);
          } else {
            standaloneBooks.push(b);
          }
        });

        const htmlParts = [];
        seriesMap.forEach(({ displayName, items }) => {
          if (items.length >= 2) {
            htmlParts.push(renderSeriesCard(displayName, items));
          } else {
            htmlParts.push(renderSingleBookCard(items[0]));
          }
        });
        standaloneBooks.forEach((b) => htmlParts.push(renderSingleBookCard(b)));

        container.innerHTML = htmlParts.join("");
        return;
      }

      container.innerHTML = filtered.map((b) => renderSingleBookCard(b)).join("");
    }

    document.getElementById("booksContainer").addEventListener("click", (e) => {
      const editBtn = e.target.closest(".js-edit-book");
      if (editBtn) {
        e.stopPropagation();
        const found = books.find((b) => b.id === editBtn.dataset.id);
        if (found) openModal(found);
        return;
      }

      const delBtn = e.target.closest(".js-delete-book");
      if (delBtn) {
        e.stopPropagation();
        deleteBook(delBtn.dataset.id);
        return;
      }

      const seriesCard = e.target.closest(".js-open-series");
      if (seriesCard) {
        openedSeriesKey = seriesCard.dataset.series;
        renderBooks();
      }
    });

    document.getElementById("goalTargetInput").addEventListener("change", (e) => {
      const selectedYear = document.getElementById("statsYearSelect").value || String(new Date().getFullYear());
      const val = Math.max(1, Math.min(500, Number(e.target.value) || 24));
      e.target.value = val;
      goals[selectedYear] = val;
      saveGoals();
      renderStats();
    });

    function buildTopRanking(sourceBooks, field) {
      const map = new Map();
      sourceBooks.forEach((b) => {
        const rawVal = (b[field] || "").trim();
        if (!rawVal) return;
        if (!map.has(rawVal)) {
          map.set(rawVal, { name: rawVal, count: 0, ratingSum: 0, ratedCount: 0 });
        }
        const item = map.get(rawVal);
        item.count++;
        if (Number(b.rating) > 0) {
          item.ratingSum += Number(b.rating);
          item.ratedCount++;
        }
      });

      return Array.from(map.values())
        .map((item) => ({
          ...item,
          avgRating: item.ratedCount > 0 ? (item.ratingSum / item.ratedCount).toFixed(1) : null
        }))
        .sort((a, b) => b.count - a.count || (Number(b.avgRating) || 0) - (Number(a.avgRating) || 0))
        .slice(0, 5);
    }

    function renderFavList(containerId, items, emptyText) {
      const el = document.getElementById(containerId);
      if (!items.length) {
        el.innerHTML = `<p style="font-size:0.85rem; color:var(--text-muted);">${emptyText}</p>`;
        return;
      }
      el.innerHTML = items
        .map(
          (item, idx) => `
          <div class="fav-item">
            <div style="display:flex; align-items:center; gap:10px; min-width:0;">
              <span class="fav-rank">${idx + 1}</span>
              <div style="min-width:0;">
                <div class="fav-name">${escapeHTML(item.name)}</div>
                <div class="fav-meta">${item.count} ${item.count === 1 ? "Buch" : "Bücher"}</div>
              </div>
            </div>
            <div class="fav-score">
              ${item.avgRating ? `${item.avgRating} ★` : "Keine"}
              <small>${item.avgRating ? "Ø Bewertung" : "Keine Sterne"}</small>
            </div>
          </div>
        `
        )
        .join("");
    }

    function renderStats() {
      const currentYearStr = String(new Date().getFullYear());
      const selectedYear = document.getElementById("statsYearSelect").value || currentYearStr;
      const now = new Date();
      const currentMonthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;

      const readBooks = books.filter((b) => (b.status || "read") === "read");
      const ratedBooks = readBooks.filter((b) => Number(b.rating) > 0);

      const booksInYear = readBooks.filter((b) => {
        const eff = getEffectiveReadDate(b);
        return eff.slice(0, 4) === selectedYear;
      });

      const booksThisMonth = readBooks.filter((b) => {
        const eff = getEffectiveReadDate(b);
        return eff.startsWith(currentMonthKey);
      });

      const pagesInYear = booksInYear.reduce((sum, b) => sum + (Number(b.pages) || 0), 0);
      const totalPages = readBooks.reduce((sum, b) => sum + (Number(b.pages) || 0), 0);

      const target = goals[selectedYear] || 24;
      document.getElementById("goalHeading").textContent = `Jahres-Leseziel ${selectedYear}`;
      document.getElementById("goalTargetInput").value = target;
      const pctGoal = Math.min(100, Math.round((booksInYear.length / target) * 100));
      document.getElementById("goalProgressFill").style.width = `${pctGoal}%`;
      document.getElementById("goalProgressText").textContent = `${booksInYear.length} von ${target} Büchern gelesen`;
      document.getElementById("goalPercentText").textContent = `${pctGoal} %`;

      const avgRating =
        ratedBooks.length > 0
          ? (ratedBooks.reduce((sum, b) => sum + Number(b.rating || 0), 0) / ratedBooks.length).toFixed(1)
          : "0.0";

      const monthlyCounts = Array(12).fill(0);
      const monthlyPages = Array(12).fill(0);

      booksInYear.forEach((b) => {
        const eff = getEffectiveReadDate(b);
        const monthIdx = Number(eff.slice(5, 7)) - 1;
        if (monthIdx >= 0 && monthIdx < 12) {
          monthlyCounts[monthIdx] += 1;
          monthlyPages[monthIdx] += Number(b.pages) || 0;
        }
      });

      const maxMonth = Math.max(...monthlyCounts, 1);

      document.getElementById("kpiGrid").innerHTML = `
        <div class="kpi-card">
          <div class="kpi-label">Gelesen in ${selectedYear}</div>
          <div class="kpi-value">${booksInYear.length}</div>
          <div class="kpi-sub">${(booksInYear.length / 12).toFixed(1)} Bücher / Monat im Schnitt</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Seiten in ${selectedYear}</div>
          <div class="kpi-value">${pagesInYear.toLocaleString("de-DE")}</div>
          <div class="kpi-sub">Ø ${Math.round(pagesInYear / 365)} Seiten / Tag</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Aktueller Monat</div>
          <div class="kpi-value">${booksThisMonth.length}</div>
          <div class="kpi-sub">${MONTHS[now.getMonth()]} ${now.getFullYear()}</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Gesamt (Alle Jahre)</div>
          <div class="kpi-value">${readBooks.length}</div>
          <div class="kpi-sub">${totalPages.toLocaleString("de-DE")} Seiten · Ø ${avgRating} ★</div>
        </div>
      `;

      document.getElementById("monthlyChartTitle").textContent = `Gelesene Bücher & Seiten pro Monat (${selectedYear})`;
      document.getElementById("monthlyChart").innerHTML = monthlyCounts
        .map((count, idx) => {
          const pct = count > 0 ? Math.max((count / maxMonth) * 100, 14) : 0;
          const p = monthlyPages[idx];
          return `
            <div class="bar-col" title="${MONTHS[idx]}: ${count} Bücher, ${p} Seiten">
              <span class="bar-count">${count > 0 ? count : ""}</span>
              <div class="bar-track">
                <div class="bar-fill" style="height: ${pct}%;"></div>
              </div>
              <span class="bar-label">${MONTHS[idx]}</span>
              <span class="bar-pages">${p > 0 ? p + " S." : ""}</span>
            </div>
          `;
        })
        .join("");

      const years = getYears();
      document.getElementById("yearlyList").innerHTML = years
        .map((y) => {
          const yBooks = readBooks.filter((b) => getEffectiveReadDate(b).slice(0, 4) === y);
          const yPages = yBooks.reduce((sum, b) => sum + (Number(b.pages) || 0), 0);
          return `
            <div class="year-row">
              <span>Jahr ${y}</span>
              <span class="year-badge">
                ${yBooks.length} ${yBooks.length === 1 ? "Buch" : "Bücher"}
                <small>${yPages.toLocaleString("de-DE")} Seiten</small>
              </span>
            </div>
          `;
        })
        .join("");

      const topGenres = buildTopRanking(readBooks, "genre");
      const topAuthors = buildTopRanking(readBooks, "author");
      renderFavList("topGenresList", topGenres, "Noch keine Genres bei gelesenen Büchern eingetragen.");
      renderFavList("topAuthorsList", topAuthors, "Noch keine Autoren bei gelesenen Büchern eingetragen.");
    }

    document.getElementById("searchInput").addEventListener("input", renderBooks);
    document.getElementById("filterStatus").addEventListener("change", renderBooks);
    document.getElementById("filterYear").addEventListener("change", renderBooks);
    document.getElementById("filterTop").addEventListener("change", renderBooks);
    document.getElementById("filterRating").addEventListener("change", renderBooks);
    document.getElementById("statsYearSelect").addEventListener("change", renderStats);

    initTheme();
    syncSeriesToggleUI();
    refreshSeriesDatalist();
    refreshYearSelectors();
    renderBooks();
    renderStats();
  </script>
</body>
</html>
