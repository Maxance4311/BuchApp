<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lesezeit – Meine Bücher & Statistiken</title>

  <!-- PWA & Home-Bildschirm Icons -->
  <meta name="theme-color" content="#0f1315" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lesezeit" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />
  <link rel="manifest" href="./manifest.json" />

  <style>
    :root {
      --bg-primary: #0f1315;
      --bg-secondary: #171d20;
      --bg-card: #1d2428;
      --bg-elevated: #252e33;
      --text-primary: #f1f5f4;
      --text-secondary: #9aa7a3;
      --text-muted: #6c7975;
      --accent: #2dd4a8;
      --accent-hover: #22b890;
      --accent-soft: rgba(45, 212, 168, 0.14);
      --star: #f5b942;
      --danger: #ef5350;
      --border: rgba(255, 255, 255, 0.08);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    [data-theme="light"] {
      --bg-primary: #f4f7f6;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --bg-elevated: #eef3f1;
      --text-primary: #141b19;
      --text-secondary: #4e5d58;
      --text-muted: #7a8984;
      --accent: #139a76;
      --accent-hover: #0e7d60;
      --accent-soft: rgba(19, 154, 118, 0.12);
      --star: #e59f16;
      --danger: #d9383a;
      --border: rgba(0, 0, 0, 0.09);
      --shadow: 0 8px 24px rgba(15, 23, 20, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      min-height: 100vh;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .app-container {
      max-width: 1040px;
      margin: 0 auto;
      padding: 24px 18px 64px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo-img {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid var(--border);
      background: #ffffff;
      box-shadow: var(--shadow);
    }

    .brand h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand p {
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #061510;
      font-weight: 650;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-size: 0.92rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-icon {
      background: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border);
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      display: grid;
      place-items: center;
      font-size: 1.05rem;
    }

    .btn-icon:hover {
      border-color: var(--accent);
    }

    .tabs {
      display: inline-flex;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      padding: 5px;
      border-radius: var(--radius-md);
      margin-bottom: 24px;
      gap: 4px;
    }

    .tab-btn {
      background: transparent;
      color: var(--text-secondary);
      padding: 9px 18px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.92rem;
    }

    .tab-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      margin-bottom: 22px;
    }

    .input, select, textarea {
      width: 100%;
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 13px;
      font-family: inherit;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    .books-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(295px, 1fr));
      gap: 16px;
    }

    .book-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .book-card:hover {
      transform: translateY(-2px);
      border-color: rgba(45, 212, 168, 0.35);
    }

    .book-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .book-genre {
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 3px 9px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .book-title {
      font-size: 1.08rem;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .book-author {
      font-size: 0.88rem;
      color: var(--text-secondary);
    }

    .stars-display {
      color: var(--star);
      font-size: 1.02rem;
      letter-spacing: 1px;
    }

    .book-note {
      font-size: 0.86rem;
      color: var(--text-secondary);
      background: var(--bg-elevated);
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border-left: 3px solid var(--accent);
    }

    .book-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .card-actions {
      display: flex;
      gap: 6px;
    }

    .btn-ghost {
      background: var(--bg-elevated);
      color: var(--text-secondary);
      padding: 5px 9px;
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
      font-weight: 600;
    }

    .btn-ghost:hover {
      color: var(--text-primary);
    }

    .btn-ghost.delete:hover {
      color: var(--danger);
    }

    .stats-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .kpi-label {
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .kpi-value {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    .kpi-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .stats-panels {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 16px;
    }

    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .panel h2 {
      font-size: 1.02rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .chart-bars {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      align-items: end;
      gap: 8px;
      height: 210px;
      padding-top: 24px;
    }

    .bar-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
      gap: 6px;
    }

    .bar-count {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-secondary);
      min-height: 16px;
    }

    .bar-track {
      width: 100%;
      max-width: 34px;
      height: 145px;
      background: var(--bg-elevated);
      border-radius: 8px 8px 4px 4px;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
    }

    .bar-fill {
      width: 100%;
      background: linear-gradient(180deg, var(--accent), #159479);
      border-radius: 8px 8px 0 0;
      transition: height 0.35s ease;
    }

    .bar-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .year-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .year-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-elevated);
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
    }

    .year-badge {
      font-weight: 700;
      color: var(--accent);
    }

    .empty-state {
      text-align: center;
      padding: 54px 20px;
      background: var(--bg-card);
      border: 1px dashed var(--border);
      border-radius: var(--radius-lg);
      color: var(--text-secondary);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 480px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .modal-header h2 {
      font-size: 1.15rem;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .star-picker {
      display: flex;
      gap: 8px;
      font-size: 1.6rem;
    }

    .star-btn {
      background: none;
      color: var(--text-muted);
      padding: 2px;
      line-height: 1;
    }

    .star-btn.active {
      color: var(--star);
      transform: scale(1.08);
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-secondary {
      background: var(--bg-elevated);
      color: var(--text-primary);
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.9rem;
    }

    @media (max-width: 760px) {
      .toolbar {
        grid-template-columns: 1fr;
      }
      .stats-panels {
        grid-template-columns: 1fr;
      }
      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <div class="brand">
        <img src="./icon-180.png" alt="Lesezeit Logo" class="brand-logo-img" />
        <div>
          <h1>Lesezeit</h1>
          <p>Deine Bücher. Dein Wissen.</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-icon" id="themeToggle" title="Design wechseln" aria-label="Design wechseln">☀️</button>
        <button class="btn-primary" id="openAddModal">+ Buch hinzufügen</button>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab-btn active" data-tab="books" role="tab">Meine Bücher</button>
      <button class="tab-btn" data-tab="stats" role="tab">Statistiken</button>
    </nav>

    <section id="tab-books">
      <div class="toolbar">
        <input type="text" id="searchInput" class="input" placeholder="Nach Titel, Autor oder Genre suchen..." />
        <select id="filterYear">
          <option value="all">Alle Jahre</option>
        </select>
        <select id="filterRating">
          <option value="all">Alle Bewertungen</option>
          <option value="5">5 Sterne</option>
          <option value="4">4+ Sterne</option>
          <option value="3">3+ Sterne</option>
        </select>
      </div>

      <div id="booksContainer" class="books-grid"></div>
    </section>

    <section id="tab-stats" style="display: none;">
      <div class="stats-header">
        <div>
          <h2 style="font-size: 1.2rem;">Deine Leseauswertung</h2>
          <p style="font-size: 0.85rem; color: var(--text-secondary);">Monatliche und jährliche Übersicht deiner gelesenen Bücher</p>
        </div>
        <select id="statsYearSelect" style="width: auto; min-width: 140px;"></select>
      </div>

      <div class="kpi-grid" id="kpiGrid"></div>

      <div class="stats-panels">
        <div class="panel">
          <h2 id="monthlyChartTitle">Gelesene Bücher pro Monat</h2>
          <div class="chart-bars" id="monthlyChart"></div>
        </div>
        <div class="panel">
          <h2>Bücher pro Jahr</h2>
          <div class="year-list" id="yearlyList"></div>
        </div>
      </div>
    </section>
  </div>

  <div class="modal-backdrop" id="bookModal" aria-hidden="true">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Gelesenes Buch speichern</h2>
        <button class="btn-icon" id="closeModal" style="width:34px;height:34px;" aria-label="Schließen">✕</button>
      </div>
      <form id="bookForm">
        <input type="hidden" id="editBookId" />
        <div class="form-group">
          <label for="bookTitle">Buchtitel *</label>
          <input type="text" id="bookTitle" class="input" required placeholder="z. B. Der Schatten des Windes" />
        </div>
        <div class="form-group">
          <label for="bookAuthor">Autor/in *</label>
          <input type="text" id="bookAuthor" class="input" required placeholder="z. B. Carlos Ruiz Zafón" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="bookDate">Gelesen am *</label>
            <input type="date" id="bookDate" class="input" required />
          </div>
          <div class="form-group">
            <label for="bookGenre">Genre</label>
            <input type="text" id="bookGenre" class="input" placeholder="z. B. Sci-Fi, Sachbuch" />
          </div>
        </div>
        <div class="form-group">
          <label>Sterne-Bewertung *</label>
          <div class="star-picker" id="starPicker">
            <button type="button" class="star-btn" data-value="1" aria-label="1 Stern">★</button>
            <button type="button" class="star-btn" data-value="2" aria-label="2 Sterne">★</button>
            <button type="button" class="star-btn" data-value="3" aria-label="3 Sterne">★</button>
            <button type="button" class="star-btn" data-value="4" aria-label="4 Sterne">★</button>
            <button type="button" class="star-btn" data-value="5" aria-label="5 Sterne">★</button>
          </div>
        </div>
        <div class="form-group">
          <label for="bookNote">Kurze Notiz (optional)</label>
          <textarea id="bookNote" rows="2" placeholder="Was hat dir besonders gefallen?"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" id="cancelModal">Abbrechen</button>
          <button type="submit" class="btn-primary">Speichern</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "lesezeit_books_v1";
    const THEME_KEY = "lesezeit_theme_v1";
    const MONTHS = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];

    const sampleBooks = [
      {
        id: "1",
        title: "Atomic Habits",
        author: "James Clear",
        dateRead: "2026-01-18",
        genre: "Persönlichkeitsentwicklung",
        rating: 5,
        note: "Sehr praxisnah für tägliche Routinen."
      },
      {
        id: "2",
        title: "Projekt Hail Mary",
        author: "Andy Weir",
        dateRead: "2026-02-24",
        genre: "Sci-Fi",
        rating: 5,
        note: "Spannend von der ersten bis zur letzten Seite."
      },
      {
        id: "3",
        title: "Eine kurze Geschichte der Zeit",
        author: "Stephen Hawking",
        dateRead: "2026-04-11",
        genre: "Physik",
        rating: 4,
        note: "Klassiker verständlich aufbereitet."
      },
      {
        id: "4",
        title: "1984",
        author: "George Orwell",
        dateRead: "2025-11-09",
        genre: "Klassiker",
        rating: 5,
        note: "Bleibt erschreckend aktuell."
      }
    ];

    let books = loadBooks();
    let currentRating = 5;

    function loadBooks() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(sampleBooks));
          return [...sampleBooks];
        }
        return JSON.parse(raw);
      } catch {
        return [...sampleBooks];
      }
    }

    function saveBooks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(books));
    }

    function initTheme() {
      const savedTheme = localStorage.getItem(THEME_KEY) || "dark";
      applyTheme(savedTheme);
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem(THEME_KEY, theme);
      document.getElementById("themeToggle").textContent = theme === "dark" ? "☀️" : "🌙";
    }

    document.getElementById("themeToggle").addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme");
      applyTheme(current === "dark" ? "light" : "dark");
    });

    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const tab = btn.dataset.tab;
        document.getElementById("tab-books").style.display = tab === "books" ? "block" : "none";
        document.getElementById("tab-stats").style.display = tab === "stats" ? "block" : "none";
        if (tab === "stats") renderStats();
      });
    });

    const modal = document.getElementById("bookModal");
    const bookForm = document.getElementById("bookForm");

    function openModal(book = null) {
      bookForm.reset();
      if (book) {
        document.getElementById("modalTitle").textContent = "Buch bearbeiten";
        document.getElementById("editBookId").value = book.id;
        document.getElementById("bookTitle").value = book.title;
        document.getElementById("bookAuthor").value = book.author;
        document.getElementById("bookDate").value = book.dateRead;
        document.getElementById("bookGenre").value = book.genre || "";
        document.getElementById("bookNote").value = book.note || "";
        currentRating = book.rating;
      } else {
        document.getElementById("modalTitle").textContent = "Gelesenes Buch speichern";
        document.getElementById("editBookId").value = "";
        document.getElementById("bookDate").value = new Date().toISOString().split("T")[0];
        currentRating = 5;
      }
      updateStarPicker(currentRating);
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
    }

    function closeModal() {
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
    }

    document.getElementById("openAddModal").addEventListener("click", () => openModal());
    document.getElementById("closeModal").addEventListener("click", closeModal);
    document.getElementById("cancelModal").addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });

    function updateStarPicker(val) {
      document.querySelectorAll(".star-btn").forEach((btn) => {
        const v = Number(btn.dataset.value);
        btn.classList.toggle("active", v <= val);
      });
    }

    document.querySelectorAll(".star-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        currentRating = Number(btn.dataset.value);
        updateStarPicker(currentRating);
      });
    });

    bookForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const id = document.getElementById("editBookId").value || String(Date.now());
      const entry = {
        id,
        title: document.getElementById("bookTitle").value.trim(),
        author: document.getElementById("bookAuthor").value.trim(),
        dateRead: document.getElementById("bookDate").value,
        genre: document.getElementById("bookGenre").value.trim() || "Allgemein",
        rating: currentRating,
        note: document.getElementById("bookNote").value.trim()
      };

      const existingIndex = books.findIndex((b) => b.id === id);
      if (existingIndex > -1) {
        books[existingIndex] = entry;
      } else {
        books.unshift(entry);
      }

      saveBooks();
      closeModal();
      refreshYearSelectors();
      renderBooks();
      if (document.getElementById("tab-stats").style.display !== "none") {
        renderStats();
      }
    });

    function deleteBook(id) {
      books = books.filter((b) => b.id !== id);
      saveBooks();
      refreshYearSelectors();
      renderBooks();
      if (document.getElementById("tab-stats").style.display !== "none") {
        renderStats();
      }
    }

    function getYears() {
      const currentYear = String(new Date().getFullYear());
      const set = new Set([currentYear]);
      books.forEach((b) => {
        if (b.dateRead) set.add(b.dateRead.slice(0, 4));
      });
      return Array.from(set).sort((a, b) => b.localeCompare(a));
    }

    function refreshYearSelectors() {
      const years = getYears();
      const filterYear = document.getElementById("filterYear");
      const statsYear = document.getElementById("statsYearSelect");

      const prevFilter = filterYear.value;
      filterYear.innerHTML = `<option value="all">Alle Jahre</option>` +
        years.map((y) => `<option value="${y}">${y}</option>`).join("");
      if ([...filterYear.options].some((o) => o.value === prevFilter)) {
        filterYear.value = prevFilter;
      }

      const prevStats = statsYear.value;
      statsYear.innerHTML = years.map((y) => `<option value="${y}">${y}</option>`).join("");
      if (prevStats && years.includes(prevStats)) {
        statsYear.value = prevStats;
      } else {
        statsYear.value = String(new Date().getFullYear());
      }
    }

    function formatStars(rating) {
      return "★".repeat(rating) + "☆".repeat(5 - rating);
    }

    function formatDateDE(dateStr) {
      if (!dateStr) return "";
      const [y, m, d] = dateStr.split("-");
      return `${d}.${m}.${y}`;
    }

    function escapeHTML(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderBooks() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      const year = document.getElementById("filterYear").value;
      const minRating = document.getElementById("filterRating").value;

      const filtered = books
        .filter((b) => {
          const matchesQuery =
            !q ||
            b.title.toLowerCase().includes(q) ||
            b.author.toLowerCase().includes(q) ||
            (b.genre && b.genre.toLowerCase().includes(q));
          const matchesYear = year === "all" || (b.dateRead && b.dateRead.startsWith(year));
          const matchesRating = minRating === "all" || b.rating >= Number(minRating);
          return matchesQuery && matchesYear && matchesRating;
        })
        .sort((a, b) => b.dateRead.localeCompare(a.dateRead));

      const container = document.getElementById("booksContainer");
      if (!filtered.length) {
        container.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <h3>Keine passenden Bücher gefunden</h3>
            <p style="margin-top:6px;">Lege über „+ Buch hinzufügen“ dein erstes gelesenes Buch an oder passe die Filter an.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered
        .map(
          (b) => `
          <article class="book-card">
            <div>
              <div class="book-top">
                <div>
                  <div class="book-title">${escapeHTML(b.title)}</div>
                  <div class="book-author">${escapeHTML(b.author)}</div>
                </div>
                <span class="book-genre">${escapeHTML(b.genre || "Allgemein")}</span>
              </div>
              <div class="stars-display" style="margin-top: 10px;" title="${b.rating} von 5 Sternen">
                ${formatStars(b.rating)}
              </div>
              ${b.note ? `<p class="book-note" style="margin-top: 10px;">${escapeHTML(b.note)}</p>` : ""}
            </div>
            <div class="book-footer">
              <span>Gelesen: ${formatDateDE(b.dateRead)}</span>
              <div class="card-actions">
                <button class="btn-ghost" onclick="openModalById('${b.id}')">Bearbeiten</button>
                <button class="btn-ghost delete" onclick="deleteBook('${b.id}')">Löschen</button>
              </div>
            </div>
          </article>
        `
        )
        .join("");
    }

    window.openModalById = function (id) {
      const found = books.find((b) => b.id === id);
      if (found) openModal(found);
    };

    window.deleteBook = deleteBook;

    function renderStats() {
      const selectedYear = document.getElementById("statsYearSelect").value || String(new Date().getFullYear());
      const now = new Date();
      const currentMonthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;

      const booksInYear = books.filter((b) => b.dateRead && b.dateRead.startsWith(selectedYear));
      const booksThisMonth = books.filter((b) => b.dateRead && b.dateRead.startsWith(currentMonthKey));

      const avgRating =
        books.length > 0
          ? (books.reduce((sum, b) => sum + Number(b.rating || 0), 0) / books.length).toFixed(1)
          : "0.0";

      const monthlyCounts = Array(12).fill(0);
      booksInYear.forEach((b) => {
        const monthIdx = Number(b.dateRead.slice(5, 7)) - 1;
        if (monthIdx >= 0 && monthIdx < 12) monthlyCounts[monthIdx]++;
      });

      const maxMonth = Math.max(...monthlyCounts, 1);

      document.getElementById("kpiGrid").innerHTML = `
        <div class="kpi-card">
          <div class="kpi-label">Gelesen in ${selectedYear}</div>
          <div class="kpi-value">${booksInYear.length}</div>
          <div class="kpi-sub">${(booksInYear.length / 12).toFixed(1)} Bücher / Monat im Schnitt</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Aktueller Monat</div>
          <div class="kpi-value">${booksThisMonth.length}</div>
          <div class="kpi-sub">${MONTHS[now.getMonth()]} ${now.getFullYear()}</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Gesamt gelesene Bücher</div>
          <div class="kpi-value">${books.length}</div>
          <div class="kpi-sub">Alle Jahre zusammen</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Ø Sterne-Bewertung</div>
          <div class="kpi-value">${avgRating} ★</div>
          <div class="kpi-sub">Aus ${books.length} Bewertungen</div>
        </div>
      `;

      document.getElementById("monthlyChartTitle").textContent = `Gelesene Bücher pro Monat (${selectedYear})`;
      document.getElementById("monthlyChart").innerHTML = monthlyCounts
        .map((count, idx) => {
          const pct = count > 0 ? Math.max((count / maxMonth) * 100, 14) : 0;
          return `
            <div class="bar-col">
              <span class="bar-count">${count > 0 ? count : ""}</span>
              <div class="bar-track">
                <div class="bar-fill" style="height: ${pct}%;"></div>
              </div>
              <span class="bar-label">${MONTHS[idx]}</span>
            </div>
          `;
        })
        .join("");

      const years = getYears();
      document.getElementById("yearlyList").innerHTML = years
        .map((y) => {
          const count = books.filter((b) => b.dateRead && b.dateRead.startsWith(y)).length;
          return `
            <div class="year-row">
              <span>Jahr ${y}</span>
              <span class="year-badge">${count} ${count === 1 ? "Buch" : "Bücher"}</span>
            </div>
          `;
        })
        .join("");
    }

    document.getElementById("searchInput").addEventListener("input", renderBooks);
    document.getElementById("filterYear").addEventListener("change", renderBooks);
    document.getElementById("filterRating").addEventListener("change", renderBooks);
    document.getElementById("statsYearSelect").addEventListener("change", renderStats);

    initTheme();
    refreshYearSelectors();
    renderBooks();
  </script>
</body>
</html>
